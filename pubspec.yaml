name: digital_brain
description: Digital Brain — আপনার ব্যক্তিগত স্মৃতি ও নিরাপদ তথ্যভান্ডার। ভয়েসে বা লিখে পাসওয়ার্ড, যোগাযোগ, ধার-দেনা, নোট ও রিমাইন্ডার রাখুন।
publish_to: 'none'
version: 1.2.0+4

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  file_selector: ^1.0.3
  flutter_local_notifications: ^22.3.1
  flutter_secure_storage: ^9.2.2
  flutter_tts: ^4.2.0
  local_auth: ^3.0.0
  path_provider: ^2.1.4
  share_plus: ^11.0.0
  speech_to_text: ^7.0.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    # Noto Sans Bengali: the standard, clear Bengali look (same family Android
    # uses), with digits that are easy to tell apart. OFL, licence in assets/fonts/.
    - family: Noto
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700

name: riyal_hisab
description: টাকাসেতু — সৌদির গ্রাহকের রিয়াল, বাংলাদেশের এজেন্টের টাকা আর মোট হিসাব, এক অ্যাপে।
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  cryptography: ^2.7.0
  file_selector: ^1.0.3
  flutter_local_notifications: ^22.3.1
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  image_picker: ^1.1.2
  local_auth: ^3.0.0
  path_provider: ^2.1.4
  share_plus: ^11.0.0
  timezone: ^0.11.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    # Noto Sans Bengali: clear digits (১ looks like ১). OFL, licence in assets/fonts/.
    - family: NotoBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700

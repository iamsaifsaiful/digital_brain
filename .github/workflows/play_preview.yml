name: Play preview

# The Play Store app as a new user gets it (free with sample ad spaces, Pro
# locks, a test switch for Pro), built as a separate app (".preview") that
# installs beside the real one. Run by hand; published as a pre-release, so
# the normal "latest" download link is not affected.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Preview APK
    runs-on: ubuntu-latest
    env:
      MY_ASSISTANT_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # The same Flutter as the tests were run with (reproducible builds).
          flutter-version: '3.47.7'
          cache: true

      - name: Create platform folders
        run: bash tool/setup_platforms.sh

      - run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log || { bash tool/annotate_failures.sh analyze.log "Analyze failed"; exit 1; }

      # Every APK given out has passed the tests (owner's review, 27 Oct).
      - name: Tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log || { bash tool/annotate_failures.sh test.log "Tests failed"; exit 1; }

      - name: Release signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KS_PW" ]; then
            echo "$KS" | base64 -d > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=myassistant\nkeyPassword=%s\n' "$KS_PW" "$KS_PW" > android/key.properties
            echo "Signing with the permanent release key."
          else
            echo "::warning::No release key secret: the APK gets a throwaway key and cannot update an older install."
          fi

      - name: Build APK
        run: |
          set -o pipefail
          DEFINES="--dart-define=EDITION=play_preview"
          flutter build apk --release --split-per-abi $DEFINES 2>&1 | tee build.log || { bash tool/annotate_failures.sh build.log "Build failed"; exit 1; }

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for a in arm64-v8a:arm64 armeabi-v7a:armv7; do
            cp "build/app/outputs/flutter-apk/app-${a%%:*}-release.apk" "play-preview-${a##*:}.apk" || { echo "::error title=Publish pre-release::no ${a%%:*} APK: $(ls build/app/outputs/flutter-apk 2>&1 | tr '\n' ' ')"; exit 1; }
          done
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          TAG="preview-${VERSION}-build.${{ github.run_number }}"
          # A failure says why as an annotation (the run's log may not be readable everywhere).
          if ! out=$(gh release create "$TAG" play-preview-arm64.apk play-preview-armv7.apk --prerelease --target "$GITHUB_SHA" \
            --title "Play preview $VERSION (build ${{ github.run_number }})" --notes "প্লে স্টোর ভার্সনের প্রিভিউ — আলাদা অ্যাপ হিসেবে ইনস্টল হয়।" 2>&1); then
            echo "::error title=Publish pre-release::$(echo "$out" | tail -5 | tr '\n' ' ')"
            exit 1
          fi

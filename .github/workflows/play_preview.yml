name: Play preview

# The Play Store app as a new user gets it (free with sample ad spaces, Pro
# locks, a test switch for Pro), built as a separate app (".preview") that
# installs beside the real one. Run by hand; published as a pre-release, so
# the normal "latest" download link is not affected.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Preview APK
    runs-on: ubuntu-latest
    env:
      MY_ASSISTANT_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create platform folders
        run: bash tool/setup_platforms.sh

      - run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log || { bash tool/annotate_failures.sh analyze.log "Analyze failed"; exit 1; }

      - name: Build APK
        run: |
          set -o pipefail
          DEFINES="--dart-define=EDITION=play_preview"
          flutter build apk --release --split-per-abi $DEFINES 2>&1 | tee build.log || { bash tool/annotate_failures.sh build.log "Build failed"; exit 1; }

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk play-preview-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk play-preview-armv7.apk
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          TAG="preview-${VERSION}-build.${{ github.run_number }}"
          gh release create "$TAG" play-preview-arm64.apk play-preview-armv7.apk --prerelease --target "$GITHUB_SHA" \
            --title "Play preview $VERSION (build ${{ github.run_number }})" --notes "প্লে স্টোর ভার্সনের প্রিভিউ — আলাদা অ্যাপ হিসেবে ইনস্টল হয়।"

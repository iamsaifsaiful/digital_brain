name: Admin app

# My Assistant Admin (admin_app/): payments, members and notifications from
# the phone. Run by hand; published as a pre-release "admin-…".
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Admin APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # The same Flutter as the tests were run with (reproducible builds).
          flutter-version: '3.47.7'
          cache: true

      - name: Create platform folders
        run: bash tool/setup_platforms.sh

      - run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log || { bash ../tool/annotate_failures.sh analyze.log "Analyze failed"; exit 1; }

      # Every APK given out has passed the tests (owner's review, 27 Oct).
      - name: Tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log || { bash ../tool/annotate_failures.sh test.log "Tests failed"; exit 1; }

      - name: Test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log || { bash ../tool/annotate_failures.sh test.log "Tests failed"; exit 1; }

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee build.log || { bash ../tool/annotate_failures.sh build.log "Build failed"; exit 1; }

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ma-admin-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ma-admin-armv7.apk
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          gh release create "admin-${VERSION}-build.${{ github.run_number }}" ma-admin-arm64.apk ma-admin-armv7.apk --prerelease --target "$GITHUB_SHA" \
            --title "My Assistant Admin $VERSION (build ${{ github.run_number }})" --notes "অ্যাডমিন অ্যাপ — শুধু অ্যাডমিনদের জন্য।"

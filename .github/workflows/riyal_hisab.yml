name: Riyal Hisab APK

# This branch holds only the riyal-bKash ledger app. Its builds are
# pre-releases with their own tags, so My Assistant's "latest" link on main
# is never touched.
on:
  push:
    branches: [riyal-hisab]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create platform folders
        run: bash tool/setup_platforms.sh

      - run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log || { bash tool/annotate_failures.sh analyze.log "Analyze failed"; exit 1; }

      - name: Test
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.log || { bash tool/annotate_failures.sh test.log "Tests failed"; exit 1; }

      - name: Release signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KS_PW" ]; then
            echo "$KS" | base64 -d > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=myassistant\nkeyPassword=%s\n' "$KS_PW" "$KS_PW" > android/key.properties
            echo "Signing with the permanent release key."
          else
            echo "::warning::No release key secret: the APK gets a throwaway key and cannot update an older install."
          fi

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log || { bash tool/annotate_failures.sh build.log "Build failed"; exit 1; }
          flutter build apk --release --split-per-abi 2>&1 | tee -a build.log || { bash tool/annotate_failures.sh build.log "Build failed"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: riyal-hisab-android
          path: build/app/outputs/flutter-apk/*release.apk

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk riyal-hisab.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk riyal-hisab-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk riyal-hisab-armv7.apk
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          TAG="riyal-hisab-v${VERSION}-build.${{ github.run_number }}"
          NOTE="রিয়াল-বিকাশ হিসাব ${VERSION} (build ${{ github.run_number }}) · commit ${GITHUB_SHA::7}. riyal-hisab.apk সব ফোনে (Android 7.0+) চলে; riyal-hisab-arm64.apk ছোট, শুধু ৬৪-বিট ফোনে।"
          gh release create "$TAG" riyal-hisab.apk riyal-hisab-arm64.apk riyal-hisab-armv7.apk --title "রিয়াল-বিকাশ হিসাব $VERSION (build ${{ github.run_number }})" --notes "$NOTE" --prerelease --latest=false --target "$GITHUB_SHA"

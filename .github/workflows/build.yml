name: Build app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create platform folders
        run: bash tool/setup_platforms.sh

      - run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log || { bash tool/annotate_failures.sh analyze.log "Analyze failed"; exit 1; }

      - name: Test
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.log || { bash tool/annotate_failures.sh test.log "Tests failed"; exit 1; }

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee build.log || { bash tool/annotate_failures.sh build.log "Build failed"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: digital-brain-android
          path: build/app/outputs/flutter-apk/*-release.apk

      # Every build on main becomes a release, so the newest APK is always at
      # https://github.com/iamsaifsaiful/digital_brain/releases/latest/download/digital-brain.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Almost every phone from the last 7 years is arm64; older 32-bit phones use the armv7 file.
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk digital-brain.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk digital-brain-armv7.apk
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          TAG="v${VERSION}-build.${{ github.run_number }}"
          NOTE="My Assistant ${VERSION} (build ${{ github.run_number }}) · commit ${GITHUB_SHA::7}. বেশিরভাগ ফোনে digital-brain.apk; খুব পুরনো ফোনে ইনস্টল না হলে digital-brain-armv7.apk।"
          gh release create "$TAG" digital-brain.apk digital-brain-armv7.apk --title "My Assistant $VERSION (build ${{ github.run_number }})" --notes "$NOTE" --latest

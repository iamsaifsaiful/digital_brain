name: Build app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create platform folders
        run: bash tool/setup_platforms.sh

      - run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log || { bash tool/annotate_failures.sh analyze.log "Analyze failed"; exit 1; }

      - name: Test
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.log || { bash tool/annotate_failures.sh test.log "Tests failed"; exit 1; }

      - name: Release signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KS_PW" ]; then
            echo "$KS" | base64 -d > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=myassistant\nkeyPassword=%s\n' "$KS_PW" "$KS_PW" > android/key.properties
            echo "Signing with the permanent release key."
          else
            echo "::warning::No release key secret: the APK gets a throwaway key and cannot update an older install."
          fi

      - name: Build APK
        run: |
          set -o pipefail
          # One APK for every phone (64-bit, 32-bit and x86), plus a smaller one per CPU type.
          # Google sign-in and our server, when set up (repository variables).
          DEFINES="--dart-define=GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID }} --dart-define=API_BASE=${{ vars.API_BASE }}"
          flutter build apk --release $DEFINES 2>&1 | tee build.log || { bash tool/annotate_failures.sh build.log "Build failed"; exit 1; }
          flutter build apk --release --split-per-abi $DEFINES 2>&1 | tee -a build.log || { bash tool/annotate_failures.sh build.log "Build failed"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: digital-brain-android
          path: build/app/outputs/flutter-apk/*release.apk

      # Every build on main becomes a release, so the newest APK is always at
      # https://github.com/iamsaifsaiful/digital_brain/releases/latest/download/digital-brain.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # digital-brain.apk installs on every phone (Android 7.0+): many budget phones
          # run 32-bit Android even on a 64-bit chip. The arm64 file is smaller.
          cp build/app/outputs/flutter-apk/app-release.apk digital-brain.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk digital-brain-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk digital-brain-armv7.apk
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          TAG="v${VERSION}-build.${{ github.run_number }}"
          NOTE="My Assistant ${VERSION} (build ${{ github.run_number }}) · commit ${GITHUB_SHA::7}. digital-brain.apk সব ফোনে (Android 7.0+) চলে; digital-brain-arm64.apk ছোট, শুধু ৬৪-বিট ফোনে।"
          gh release create "$TAG" digital-brain.apk digital-brain-arm64.apk digital-brain-armv7.apk --title "My Assistant $VERSION (build ${{ github.run_number }})" --notes "$NOTE" --latest

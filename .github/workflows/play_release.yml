name: Play release

# The app for Google Play itself (owner, 29 Oct): the real package name and
# label, Premium through Google Play Billing, AdMob ads (the real IDs from the
# repository's variables ADMOB_APP_ID, ADMOB_BANNER, ADMOB_FULL; Google's test
# IDs while they are not set), no buying link to the website, and the Dart
# code obfuscated. Builds the .aab for the Play Console plus APKs to try.
# Run by hand; published as a pre-release (the "latest" link is not affected).
on:
  workflow_dispatch:
  # Until this file is on the default branch, a tag starts it: git tag play-go-<anything> && git push origin play-go-<anything>
  push:
    tags: ['play-go-*']

permissions:
  contents: write

jobs:
  android:
    name: Play AAB
    runs-on: ubuntu-latest
    env:
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # The same Flutter as the tests were run with (reproducible builds).
          flutter-version: '3.47.7'
          cache: true

      - name: Create platform folders
        run: bash tool/setup_platforms.sh

      - run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log || { bash tool/annotate_failures.sh analyze.log "Analyze failed"; exit 1; }

      # Every APK given out has passed the tests (owner's review, 27 Oct).
      - name: Tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log || { bash tool/annotate_failures.sh test.log "Tests failed"; exit 1; }

      - name: Release signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KS_PW" ]; then
            echo "$KS" | base64 -d > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=myassistant\nkeyPassword=%s\n' "$KS_PW" "$KS_PW" > android/key.properties
            echo "Signing with the permanent release key."
          else
            echo "::warning::No release key secret: the APK gets a throwaway key and cannot update an older install."
          fi

      - name: Build AAB and APKs
        env:
          ADMOB_BANNER: ${{ vars.ADMOB_BANNER }}
          ADMOB_FULL: ${{ vars.ADMOB_FULL }}
        run: |
          set -o pipefail
          DEFINES="--dart-define=EDITION=play --dart-define=PRO_LINK=off"
          [ -n "$ADMOB_BANNER" ] && DEFINES="$DEFINES --dart-define=ADMOB_BANNER=$ADMOB_BANNER"
          [ -n "$ADMOB_FULL" ] && DEFINES="$DEFINES --dart-define=ADMOB_FULL=$ADMOB_FULL"
          [ -z "$ADMOB_APP_ID" ] && echo "::warning::ADMOB_APP_ID is not set: Google's test ads only."
          OBF="--obfuscate --split-debug-info=build/symbols"
          flutter build appbundle --release $OBF $DEFINES 2>&1 | tee build.log || { bash tool/annotate_failures.sh build.log "AAB build failed"; exit 1; }
          flutter build apk --release --split-per-abi $OBF $DEFINES 2>&1 | tee -a build.log || { bash tool/annotate_failures.sh build.log "APK build failed"; exit 1; }
          # The symbols turn an obfuscated crash back into names (kept with the release, never in the app).
          (cd build && zip -qr ../play-symbols.zip symbols)

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/bundle/release/app-release.aab play.aab || { echo "::error title=Publish pre-release::no AAB: $(ls -R build/app/outputs/bundle 2>&1 | tr '\n' ' ')"; exit 1; }
          for a in arm64-v8a:arm64 armeabi-v7a:armv7; do
            cp "build/app/outputs/flutter-apk/app-${a%%:*}-release.apk" "play-${a##*:}.apk" || { echo "::error title=Publish pre-release::no ${a%%:*} APK"; exit 1; }
          done
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          TAG="play-${VERSION}-build.${{ github.run_number }}"
          if ! out=$(gh release create "$TAG" play.aab play-arm64.apk play-armv7.apk play-symbols.zip --prerelease --target "$GITHUB_SHA" \
            --title "Play $VERSION (build ${{ github.run_number }})" --notes "Google Play-র জন্য: .aab প্লে কনসোলে আপলোডের জন্য, APK পরীক্ষার জন্য।" 2>&1); then
            echo "::error title=Publish pre-release::$(echo "$out" | tail -5 | tr '\n' ' ')"
            exit 1
          fi

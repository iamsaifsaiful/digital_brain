name: Media voice-over
# Bangla voice-over clips for the promo video (tool/media). Runs when the
# media-vo branch is pushed; the clips go to a release.
on:
  push:
    branches: [media-vo]
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Edge voices (may be refused)
        if: false
        continue-on-error: true
        run: |
          (pip install edge-tts==7.2.0 && python tool/media/tts.py) > edge.log 2>&1 || true
      - name: Transcribe the owner's voice-over
        continue-on-error: true
        run: |
          mkdir -p out
          (pip install faster-whisper==1.0.3 && python tool/media/transcribe.py) > out/transcribe.log 2>&1 || true
      - name: Indic Parler-TTS
        if: false
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          (pip install git+https://github.com/huggingface/parler-tts.git@main soundfile && pip install --force-reinstall --no-deps torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu && python tool/media/parler.py) > parler.log 2>&1 || true
      - name: MMS draft voice
        if: false
        continue-on-error: true
        run: |
          (pip install transformers soundfile && pip install --force-reinstall --no-deps torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu; python tool/media/mms.py) > mms.log 2>&1 || true
          tail -c 3000 mms.log > out/mms.log 2>/dev/null || (mkdir -p out && tail -c 3000 mms.log > out/mms.log)
      - name: Save to the branch
        if: always()
        run: |
          mkdir -p media-out && cp -r out/* media-out/ 2>/dev/null || true
          tail -c 20000 edge.log > media-out/edge.log || true
          tail -c 20000 parler.log > media-out/parler.log || true
          git config user.name ci && git config user.email ci@localhost
          git add -f media-out && git commit -qm "voice-over clips ${{ github.run_number }}" && git push origin HEAD:media-vo

name: Media voice-over
# Bangla voice-over clips for the promo video (tool/media). Runs when the
# media-vo branch is pushed; the clips go to a release.
on:
  push:
    branches: [media-vo]
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Edge voices (may be refused)
        continue-on-error: true
        run: |
          (pip install edge-tts==7.2.0 && python tool/media/tts.py) > edge.log 2>&1 || true
      - name: Indic Parler-TTS
        continue-on-error: true
        run: |
          (pip install "torch==2.3.1" --extra-index-url https://download.pytorch.org/whl/cpu && pip install git+https://github.com/huggingface/parler-tts.git@v0.2.2 soundfile && python tool/media/parler.py) > parler.log 2>&1 || true
      - name: Save to the branch
        if: always()
        run: |
          mkdir -p media-out && cp -r out/* media-out/ 2>/dev/null || true
          tail -c 20000 edge.log > media-out/edge.log || true
          tail -c 20000 parler.log > media-out/parler.log || true
          git config user.name ci && git config user.email ci@localhost
          git add -f media-out && git commit -qm "voice-over clips ${{ github.run_number }}" && git push origin HEAD:media-vo
